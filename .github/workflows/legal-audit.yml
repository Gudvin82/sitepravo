name: Legal Compliance Audit

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL сайта для аудита (переопределяет vars.SITEPRAVO)'
        required: false
        type: string
  schedule:
    - cron: '0 9 * * 1'   # Каждый понедельник 9:00 UTC

jobs:
  legal-audit:
    name: SitePravo Legal Audit
    runs-on: ubuntu-latest

    steps:
      - name: Run SitePravo Audit
        uses: Gudvin82/sitepravo@v1
        with:
          url: ${{ inputs.url || vars.SITEPRAVO }}
          fail_on_critical: true
          # fail_on_high: false
          # profile: legal_first

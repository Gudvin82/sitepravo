name: 'SitePravo Legal Audit'
description: 'Автоматический юридический и compliance-аудит сайта по российскому законодательству (ФЗ-152, 38-ФЗ, ЗоЗПП и др.)'
author: 'SitePravo'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  url:
    description: 'URL сайта для аудита'
    required: true
  profile:
    description: 'Профиль аудита: legal_first (по умолчанию) или technical_first'
    required: false
    default: 'legal_first'
  fail_on_critical:
    description: 'Завершить с ошибкой при наличии критических нарушений'
    required: false
    default: 'true'
  fail_on_high:
    description: 'Завершить с ошибкой при наличии high-нарушений'
    required: false
    default: 'false'
  max_wait_seconds:
    description: 'Максимальное время ожидания результата (секунды)'
    required: false
    default: '300'

outputs:
  grade:
    description: 'Trust Grade (EXCELLENT, GOOD, FAIR, POOR, CRITICAL)'
  score:
    description: 'Числовой score (0-100)'
  critical_count:
    description: 'Количество критических нарушений'
  high_count:
    description: 'Количество high-нарушений'
  audit_id:
    description: 'UUID аудита для последующего получения полного отчёта'
  report_url:
    description: 'Ссылка на полный отчёт на sitepravo.ru'

runs:
  using: 'composite'
  steps:
    - name: Run SitePravo Audit
      shell: bash
      run: |
        set -euo pipefail

        URL="${{ inputs.url }}"
        PROFILE="${{ inputs.profile }}"
        MAX_WAIT="${{ inputs.max_wait_seconds }}"
        BASE="https://sitepravo.ru/api"

        echo "🔍 Запуск аудита: $URL (профиль: $PROFILE)"

        # Запустить аудит (без -f, чтобы обработать 429 DOMAIN_COOLDOWN)
        LAUNCH_BODY=$(mktemp)
        HTTP_CODE=$(curl -s -o "$LAUNCH_BODY" -w "%{http_code}" -X POST "$BASE/audits" \
          -H "Content-Type: application/json" \
          -d "{\"url\":\"$URL\",\"profile\":\"$PROFILE\",\"source\":\"sitepravo_github_action\",\"consentAccepted\":true,\"pdConsentAccepted\":true,\"legalBasisConfirmed\":true,\"scanMode\":\"public-legal-compliance\",\"termsVersion\":\"2026-06-02\",\"privacyVersion\":\"2026-07-15\"}")
        LAUNCH=$(cat "$LAUNCH_BODY"); rm -f "$LAUNCH_BODY"

        AUDIT_ID=$(echo "$LAUNCH" | python3 -c "
        import sys, json
        d = json.load(sys.stdin)
        # 201 Created → 'id'; 429 DOMAIN_COOLDOWN → 'auditId'
        aid = d.get('id') or d.get('auditId')
        if not aid:
            print('NO_ID', file=sys.stderr)
            sys.exit(1)
        print(aid)
        ")

        if [ "$HTTP_CODE" = "429" ]; then
          echo "⏳ Домен недавно проверялся (DOMAIN_COOLDOWN). Подключаемся к существующему аудиту: $AUDIT_ID"
        elif [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "202" ]; then
          echo "✅ Аудит запущен. ID: $AUDIT_ID"
        else
          echo "❌ Ошибка запуска аудита (HTTP $HTTP_CODE): $LAUNCH"
          exit 1
        fi

        echo "audit_id=$AUDIT_ID" >> $GITHUB_OUTPUT

        # Polling — status находится в lifecycle.status
        ELAPSED=0
        while [ $ELAPSED -lt $MAX_WAIT ]; do
          sleep 5
          ELAPSED=$((ELAPSED + 5))
          RESULT=$(curl -s "$BASE/audits/$AUDIT_ID")
          STATUS=$(echo "$RESULT" | python3 -c "
        import sys,json
        d=json.load(sys.stdin)
        print(d.get('lifecycle',{}).get('status','') or d.get('status',''))
        ")

          echo "  [$ELAPSED s] status: $STATUS"

          if [ "$STATUS" = "completed" ]; then
            eval $(echo "$RESULT" | python3 -c "
        import sys, json
        from collections import Counter
        d = json.load(sys.stdin)
        scores = d.get('scores', {})
        grade = scores.get('trustGrade', '?')
        score = scores.get('overall', 0)
        findings = d.get('findings', [])
        sev = Counter(f.get('severity','?') for f in findings)
        crit = sev.get('critical', 0)
        high = sev.get('high', 0)
        med  = sev.get('medium', 0)
        low  = sev.get('low', 0)
        print(f'GRADE={grade}')
        print(f'SCORE={score}')
        print(f'CRITICAL={crit}')
        print(f'HIGH={high}')
        print(f'MEDIUM={med}')
        print(f'LOW={low}')
        ")

            echo ""
            echo "════════════════════════════════════════"
            echo "  Trust Grade : $GRADE  (Score: $SCORE/100)"
            echo "  Findings    : critical=$CRITICAL, high=$HIGH, medium=$MEDIUM, low=$LOW"
            echo "  Report      : https://sitepravo.ru/report/$AUDIT_ID"
            echo "════════════════════════════════════════"

            echo "grade=$GRADE"             >> $GITHUB_OUTPUT
            echo "score=$SCORE"             >> $GITHUB_OUTPUT
            echo "critical_count=$CRITICAL" >> $GITHUB_OUTPUT
            echo "high_count=$HIGH"         >> $GITHUB_OUTPUT
            echo "report_url=https://sitepravo.ru/report/$AUDIT_ID" >> $GITHUB_OUTPUT

            FAIL=0
            if [ "${{ inputs.fail_on_critical }}" = "true" ] && [ "$CRITICAL" -gt 0 ]; then
              echo "❌ Обнаружены критические нарушения ($CRITICAL шт.) — аудит не пройден"
              FAIL=1
            fi
            if [ "${{ inputs.fail_on_high }}" = "true" ] && [ "$HIGH" -gt 0 ]; then
              echo "❌ Обнаружены high-нарушения ($HIGH шт.) — аудит не пройден"
              FAIL=1
            fi
            if [ $FAIL -eq 0 ]; then
              echo "✅ Аудит пройден (Grade: $GRADE)"
            fi
            exit $FAIL
          fi

          if [ "$STATUS" = "failed" ]; then
            echo "❌ Ошибка аудита"
            exit 1
          fi
        done

        echo "❌ Таймаут ожидания ($MAX_WAIT сек)"
        exit 1
